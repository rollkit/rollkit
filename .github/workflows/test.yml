---
# This workflow is triggered by ci.yml workflow or manually
name: Tests / Code Coverage
permissions:
  contents: read
"on":
  workflow_call:
  workflow_dispatch:

jobs:
  build_all-apps:
    name: Build All ev-node Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Build all ev-node binaries
        run: just build-all

  go_mod_tidy_check:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - uses: extractions/setup-just@v4
      - run: just deps
      - name: check for diff
        run: git diff --exit-code

  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run unit test
        run: just test-cover
      - name: Upload unit test coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-coverage-report-${{ github.sha }}
          path: ./coverage.txt

  integration_test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Run integration test
        run: just test-integration-cover
      - name: Upload integration test coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-test-coverage-report-${{ github.sha }}
          path: ./node/coverage.txt

  e2e-tests:
    name: Run E2E System Tests
    needs: build_all-apps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build evstack:local-dev (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/testapp/Dockerfile
          load: true
          tags: evstack:local-dev
          cache-from: type=gha,scope=ev-node-testapp
          cache-to: type=gha,mode=max,scope=ev-node-testapp
      - name: Install just
        uses: extractions/setup-just@v4
      - name: E2E Tests
        run: just test-e2e

  evm-tests:
    name: Run EVM Execution Tests
    needs: build_all-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: set up go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: "**/go.sum"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: EVM Tests
        run: just test-evm

  combine_and_upload_coverage:
    name: Combine and Upload Coverage
    needs: [unit_test, integration_test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download unit test coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: unit-test-coverage-report-${{ github.sha }}
          path: ./unit-coverage
      - name: Download integration test coverage report
        uses: actions/download-artifact@v8.0.2
        with:
          name: integration-test-coverage-report-${{ github.sha }}
          path: ./integration-coverage
      - name: Upload combined coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./unit-coverage/coverage.txt,./integration-coverage/coverage.txt
          flags: combined
